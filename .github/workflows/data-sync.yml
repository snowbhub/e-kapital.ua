name: Official data snapshots
on:
  push:
    branches: [main]
    paths:
      - "src/lib/data/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/ingest.ts"
      - ".github/workflows/data-sync.yml"
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: official-data-sync
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run data:sync
      - run: npm test
      - name: Commit validated last-known-good snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/market.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh verified official snapshots'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Report degraded source health
        run: |
          node --input-type=module -e "import fs from 'node:fs';const m=JSON.parse(fs.readFileSync('data/market.json'));const bad=m.health.filter(h=>h.error);for(const h of bad)console.log('::error::'+h.id+': '+h.error);if(bad.length)process.exit(1)"
