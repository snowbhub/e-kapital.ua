name: Account integration
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  passkeys:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: integration-test-only
          POSTGRES_DB: capital_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d capital_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:integration-test-only@localhost:5432/capital_test
      DATA_ENCRYPTION_KEY: "1212121212121212121212121212121212121212121212121212121212121212"
      SITE_URL: http://localhost:3000
      AUTH_TEST_BASE_URL: http://localhost:3000
      ACCOUNT_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- tests/e2e/account.spec.ts --project=chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: account-playwright-results
          path: test-results/
          retention-days: 7
